[package]
name = "server"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.2.0", features = ["aws_lc_rs"] }
once_cell = "1.21.3"
proto = { path = "../proto" }
reqwest = { version = "0.12.24", features = ["json"] }
rocket = "0.5.1"
sea-orm = { version = "1.1.19", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.228", features = ["derive"] }
