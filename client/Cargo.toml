[package]
name = "commeator"
version = "0.0.1"
authors = ["Levi Lovie <leviiloviee@gmail.com>"]
edition = "2024"

[dependencies]
proto = { path = "../proto" }

anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
dioxus = { version = "0.7.1", features = ["router"] }
futures = "0.3.31"
gloo-storage = "0.3.0"
md5 = "0.8.0"
ron = "0.12.0"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.18.1", features = ["serde", "v4", "js"] }
wasm-bindgen-futures = "0.4.53"
web-sys = "0.3.80"
once_cell = "1.21.3"
dotenvy = "0.15.7"
js-sys = "0.3.82"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-desktop = "0.7.0-rc.1"
dirs = "6.0.0"
reqwest = { version = "0.12.24", features = ["cookies"] }
reqwest-websocket = "0.5.1"
tokio = { version = "1.48.0", features = ["full"] }
webbrowser = "1.0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6.0", features = ["websocket"] }

[build-dependencies]
dotenvy = "0.15.7"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
